cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
    "src/platform/pac",
    "src/platform/hal",
    "src/kernel",
    "src/driver",
    "src/lib/gfx",
    "src/lib/crypto",
    "src/lib/utils",
    "src/lib/calib",
    "src/lib/kernfs",
    "src/firmware",
    "src/platform/bsp",
    "src/platform/traits",
]
resolver = "2"

[workspace.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
defmt = "0.3.5"
heapless = "0.8.0"
embedded-hal = "1.0.0"
portable-atomic = { version = "1.6.0", features = ["fallback"] }
PY32f071xx-pac = { version = "0.1.0", features = ["rt"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
overflow-checks = false
debug = 0
strip = false
incremental = false

[profile.dev]
opt-level = "s"
debug = 1
lto = "thin"
panic = "immediate-abort"

