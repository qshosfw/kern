[package]
name = "gfx"
version = "0.1.0"
edition = "2024"
description = "Graphics library and font rendering for kern firmware"

[dependencies]
kernel = { path = "../../kernel" }
utils = { path = "../utils" }
heapless = { workspace = true }

[features]
default = []
grayscale = ["kernel/grayscale"]
dither_fallback = ["kernel/dither_fallback"]

