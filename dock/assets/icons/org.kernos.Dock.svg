<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a404c"/>
      <stop offset="50%" stop-color="#22262f"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9c958b"/>
      <stop offset="48%" stop-color="#757068"/>
      <stop offset="100%" stop-color="#55514b"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bef4ea"/>
      <stop offset="100%" stop-color="#7ce3d4"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58b0ff"/>
      <stop offset="100%" stop-color="#1d6de5"/>
    </linearGradient>
    <linearGradient id="antenna" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181b21"/>
      <stop offset="40%" stop-color="#434955"/>
      <stop offset="100%" stop-color="#14171c"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Stubby antenna -->
  <rect x="40" y="7" width="13" height="28" rx="5" fill="url(#antenna)"/>
  <rect x="38" y="23" width="17" height="12" rx="3" fill="url(#antenna)"/>

  <!-- Top LED indicator -->
  <rect x="57" y="26" width="12" height="6" rx="2.5" fill="#34d399"/>

  <!-- Rotary volume knob with cobalt stripe -->
  <rect x="74" y="18" width="19" height="17" rx="4" fill="url(#antenna)"/>
  <rect x="81.5" y="18" width="4" height="15" rx="1.5" fill="url(#cobalt)"/>

  <!-- Left PTT paddle -->
  <rect x="24" y="45" width="9" height="27" rx="4" fill="#181c24" stroke="url(#cobalt)" stroke-width="2.2"/>
  <rect x="25" y="77" width="7" height="10" rx="3" fill="#2c313b"/>

  <!-- Main polymer chassis -->
  <g filter="url(#shadow)">
    <rect x="31" y="30" width="66" height="90" rx="11" fill="url(#chassis)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2"/>
  </g>

  <!-- Titanium armor plate with screw ears -->
  <path d="M36 34 H92 L95 38 V52 L91 56 V96 L95 100 V112 L91 116 H37 L33 112 V100 L37 96 V56 L33 52 V38 Z"
        fill="url(#armor)" stroke="#fff7ec" stroke-opacity="0.28" stroke-width="1"/>

  <!-- 4 hex bolts -->
  <circle cx="38.5" cy="41.5" r="2.6" fill="#d4d1ca" stroke="#1e2024" stroke-width="1"/>
  <circle cx="89.5" cy="41.5" r="2.6" fill="#d4d1ca" stroke="#1e2024" stroke-width="1"/>
  <circle cx="38.5" cy="107.5" r="2.6" fill="#d4d1ca" stroke="#1e2024" stroke-width="1"/>
  <circle cx="89.5" cy="107.5" r="2.6" fill="#d4d1ca" stroke="#1e2024" stroke-width="1"/>

  <!-- Glossy top nameplate -->
  <path d="M46 37 H82 L84 44 H44 Z" fill="#121418"/>
  <rect x="52" y="39.5" width="24" height="2.2" rx="1.1" fill="#e5e7eb" fill-opacity="0.88"/>

  <!-- Recessed LCD bezel + transflective screen -->
  <rect x="42" y="47" width="44" height="31" rx="4.5" fill="#101216"/>
  <rect x="45" y="50" width="38" height="25" rx="2.5" fill="url(#lcd)"/>
  <!-- Crisp LCD frequency bars -->
  <rect x="48" y="52.5" width="32" height="3.2" rx="0.8" fill="#1e2476"/>
  <rect x="48" y="58.5" width="22" height="5.2" rx="1" fill="#1e2476"/>
  <rect x="73" y="59.5" width="7" height="3.2" rx="0.8" fill="#1e2476" fill-opacity="0.7"/>
  <rect x="48" y="66.5" width="18" height="3.5" rx="0.8" fill="#1e2476" fill-opacity="0.82"/>
  <rect x="48" y="71.8" width="25" height="1.8" rx="0.8" fill="#1e2476" fill-opacity="0.6"/>

  <!-- Keypad 4x3 grid -->
  <g fill="#1c2028" stroke="#ffffff" stroke-opacity="0.14" stroke-width="0.7">
    <rect x="42" y="83" width="9.5" height="6.5" rx="1.8"/>
    <rect x="53.5" y="83" width="9.5" height="6.5" rx="1.8"/>
    <rect x="65" y="83" width="9.5" height="6.5" rx="1.8"/>
    <rect x="76.5" y="83" width="9.5" height="6.5" rx="1.8"/>

    <rect x="42" y="92" width="9.5" height="6.5" rx="1.8"/>
    <rect x="53.5" y="92" width="9.5" height="6.5" rx="1.8"/>
    <rect x="65" y="92" width="9.5" height="6.5" rx="1.8"/>
    <rect x="76.5" y="92" width="9.5" height="6.5" rx="1.8"/>

    <rect x="42" y="101" width="9.5" height="6.5" rx="1.8"/>
    <rect x="53.5" y="101" width="9.5" height="6.5" rx="1.8"/>
    <rect x="65" y="101" width="9.5" height="6.5" rx="1.8"/>
    <rect x="76.5" y="101" width="9.5" height="6.5" rx="1.8"/>
  </g>
</svg>
