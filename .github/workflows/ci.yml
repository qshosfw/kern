name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-abi:
    name: Format, ABI & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: thumbv6m-none-eabi, x86_64-unknown-linux-gnu
          components: rust-src, llvm-tools-preview, rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-check

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify KRX ABI header sync
        run: ./kern abi --check

      - name: Syntax-check Python tooling
        run: python3 -m py_compile tools/*.py

      - name: Run .kfw container & Ascon selftest
        run: ./kern kfw selftest

      - name: Run KernFS WebDAV mounter selftest
        run: ./kern mount --selftest

      - name: Run Kern Dock GUI headless selftest
        run: ./kern dock --selftest

      - name: Verify architectural & chip-isolation invariants
        run: python3 tools/check_firmware_invariants.py

      - name: Check firmware (UV-K1 / UV-K5v3, 0 warnings)
        run: ./kern check --deny-warnings

      - name: Check firmware (UV-K10Pro, 0 warnings)
        run: ./kern check --target UV-K10Pro --deny-warnings

  host-tests:
    name: Host Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: host-tests

      - name: Run workspace unit tests
        run: ./kern test

      - name: Run kern-emu silicon twin unit tests
        run: cargo test --manifest-path emu/Cargo.toml --target x86_64-unknown-linux-gnu

  packages:
    name: Build & Verify KRX Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: thumbv6m-none-eabi, x86_64-unknown-linux-gnu
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: packages

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Verify KRX ABI header sync
        run: ./kern abi --check

      - name: Build and verify all KRX packages
        run: ./kern pkg

  firmware-build:
    name: Firmware Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-abi, host-tests]
    strategy:
      fail-fast: false
      matrix:
        target: ["UV-K1", "UV-K10Pro"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: fw-${{ matrix.target }}

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Build release firmware & enforce memory budget
        run: ./kern build --target ${{ matrix.target }} --deny-warnings --json target/size-${{ matrix.target }}.json

      - name: Publish memory budget summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          with open("target/size-${{ matrix.target }}.json") as f:
              d = json.load(f)
          s = d["sections"]
          print(f"### Memory Budget — `{d['target']}` (`{d['chip']}`)")
          print("")
          print("| Region | Used | Budget | Free | Utilization |")
          print("|:---|---:|---:|---:|---:|")
          print(f"| **Flash** | {d['flash_used']:,} B | {d['flash_budget']:,} B | {d['flash_free']:,} B | {d['flash_pct']:.2f}% |")
          print(f"| **SRAM** | {d['ram_used']:,} B | {d['ram_budget']:,} B | {d['ram_free']:,} B | {d['ram_pct']:.2f}% |")
          print("")
          print(f"Sections: `.vector_table` {s['vectors']:,} B · `.text` {s['text']:,} B · `.rodata` {s['rodata']:,} B · `.data` {s['data']:,} B · `.bss` {s['bss']:,} B · `.uninit` {s['uninit']:,} B")
          EOF

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kern-firmware-${{ matrix.target }}
          path: |
            target/dist/kern-*.kfw
            target/dist/kern-*.qs.bin
            target/dist/kern-*.bin
            target/dist/kern-*.elf
            target/dist/kern-*.manifest.json
            target/dist/SHA256SUMS
            target/size-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
