name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Staging version label for dry-run artifact build (e.g. v0.1.0-rc1)"
        required: true
        default: "v0.1.0-rc1"
      sec_cnt:
        description: "Monotonic anti-rollback security counter (integer >= 1)"
        required: false
        default: "1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify ABI, Crypto & Host Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-verify

      - name: Verify KRX ABI header sync
        run: ./kern abi --check

      - name: Run .kfw signing/anti-brick & RigWire protocol selftests
        run: |
          ./kern kfw selftest
          ./kern wire test

      - name: Run workspace unit tests
        run: ./kern test

  build-artifacts:
    name: Build & Sign Release Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: thumbv6m-none-eabi
          components: rust-src, llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-build

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Determine release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            LABEL="${GITHUB_REF_NAME}"
            SEC_CNT="${GITHUB_RUN_NUMBER:-1}"
          else
            LABEL="${{ inputs.tag }}"
            SEC_CNT="${{ inputs.sec_cnt || '1' }}"
          fi
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "sec_cnt=${SEC_CNT}" >> "$GITHUB_OUTPUT"

      - name: Run signed release pipeline
        env:
          REL_LABEL: ${{ steps.meta.outputs.label }}
          REL_SEC_CNT: ${{ steps.meta.outputs.sec_cnt }}
          KERN_LMS_KEY_JSON: ${{ secrets.KERN_LMS_KEY_JSON }}
          KERN_MAC_KEY: ${{ secrets.KERN_MAC_KEY }}
        run: |
          EXTRA_FLAGS=""
          if [[ -n "${KERN_LMS_KEY_JSON}" || -n "${KERN_MAC_KEY}" ]]; then
            EXTRA_FLAGS="--require-signed"
          else
            echo "::warning::No signing secret (KERN_LMS_KEY_JSON / KERN_MAC_KEY) configured — producing unsigned staging bundle."
          fi

          ./kern release \
            --version "${REL_LABEL}" \
            --sec-cnt "${REL_SEC_CNT}" \
            --out dist \
            --skip-tests \
            ${EXTRA_FLAGS}

          ./kern kfw inspect "dist/kern-${REL_LABEL}.kfw"
          cat dist/SHA256SUMS.txt

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: kern-release-${{ steps.meta.outputs.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-artifacts]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v4
        with:
          name: kern-release-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.kfw
            dist/*.bin
            dist/*.json
            dist/*.sig
            dist/SHA256SUMS.txt
            dist/modules/*
            dist/tools/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
