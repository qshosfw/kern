name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: thumbv6m-none-eabi, x86_64-unknown-linux-gnu
          components: rust-src, llvm-tools-preview

      - name: Install ARM GNU Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi python3

      - name: Build Release Firmware
        run: ./kern build

      - name: Generate Checksums
        run: |
          cd target
          sha256sum firmware.bin firmware_packed.bin > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/firmware.bin
            target/firmware_packed.bin
            target/SHA256SUMS
            tools/rigwire.py
          draft: false
          prerelease: false
          generate_release_notes: true
