[package]
name = "drivers"
version = "0.1.0"
edition = "2024"

[dependencies]
bsp = { path = "../platform/bsp" }
py32-pac = { path = "../platform/pac", package = "py32f071-pac" }
kern-platform-traits = { path = "../platform/traits" }
kernel = { path = "../kernel" }
utils = { path = "../lib/utils" }
crypto = { path = "../lib/crypto" }
cortex-m = { workspace = true }
heapless = { workspace = true }
kernfs = { path = "../lib/kernfs" }
calib = { path = "../lib/calib" }
embedded-hal = { workspace = true }
py32-hal = { path = "../platform/hal" }

[features]
default = ["radio", "audio", "filesystem", "uart", "display", "usb", "usb_cdc"]
radio = ["kernel/radio"]
audio = ["kernel/audio"]
filesystem = ["kernel/filesystem"]
uart = ["kernel/uart"]
display = []
secure_fs = ["kernel/secure_fs"]
fm_radio = []
usb = []
usb_cdc = ["usb"]
usb_msc = ["usb"]
usb_msc_fat = ["usb_msc"]
grayscale = ["kernel/grayscale"]

