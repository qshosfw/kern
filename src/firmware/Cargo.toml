[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
py32-pac = { path = "../platform/pac", package = "py32f071-pac" }
py32-hal = { path = "../platform/hal" }
bsp = { path = "../platform/bsp" }
drivers = { path = "../driver" }
kernel = { path = "../kernel" }
gfx = { path = "../lib/gfx" }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
heapless = { workspace = true }
kernfs = { path = "../lib/kernfs" }
crypto = { path = "../lib/crypto" }
utils = { path = "../lib/utils" }
calib = { path = "../lib/calib" }

[features]
default = [
    "radio",
    "audio",
    "filesystem",
    "uart",
    "usb",
    "usb_cdc",
    "dma",
    "hw_crc",
    "rtc",
    "internal_flash",
    "panic_gui",
    "provision_apps",
    "flashlight",
    "animations",
    "dynamic_spi",
    "overclock_72mhz",
]

# 📦 Media & Asset Provisioning
provision_rogers = []
provision_apps = []

# ⚙️ Granular Settings & Diagnostics
settings_calib = []
settings_debug = []
overclock_72mhz = []

# ⚙️ Execution Runtime Engines
krx_vm = ["kernel/krx_vm"]

# 📡 Hardware Peripheral & RF Subsystems
radio = ["drivers/radio"]
fm_radio = ["drivers/fm_radio"]
audio = ["drivers/audio", "kernel/audio"]
uart = ["drivers/uart", "kernel/uart"]
usb = ["drivers/usb"]
usb_cdc = ["usb", "drivers/usb_cdc"]
# USB MSC & Virtual FAT are preserved in framework for modularity but left disabled:
# Costs ~5KB Flash + 512B RAM buffers, risks host FAT cache desynchronization,
# and causes OS metadata pollution. Filesystem is accessed directly via CDC serial protocol instead.
usb_msc = ["usb", "drivers/usb_msc"]
usb_msc_fat = ["usb_msc", "drivers/usb_msc_fat"]
dma = []
hw_crc = []
rtc = []
internal_flash = []

# 💾 Storage & Cryptographic Security
filesystem = ["drivers/filesystem", "kernel/filesystem"]
secure_fs = ["drivers/secure_fs", "kernel/secure_fs"]
passcode = ["secure_fs"]
app_explorer = ["filesystem"]
app_tasks = []
app_hibernation = ["filesystem"]

# 🎨 Display, Sound & Asset Bundles
boot_assets = []
boot_jingle = []
extra_rogers = []
flashlight = []
animations = []
grayscale = ["kernel/grayscale", "drivers/grayscale", "gfx/grayscale"]
dynamic_spi = []

# 🛡️ Diagnostics, Telemetry & Forensics
flight_recorder = []
panic_gui = []
panic_gui_extended = ["panic_gui"]
panic_disasm = []
panic_uart = ["uart"]

# 📦 Feature Bundles & Group Configurations
full = ["default", "passcode", "panic_gui", "panic_uart"]
security = ["filesystem", "secure_fs", "passcode"]
lean = ["radio", "audio"]
