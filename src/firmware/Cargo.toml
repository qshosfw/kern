[package]
name = "firmware"
version = "0.1.0"
edition = "2024"

[dependencies]
py32-pac = { path = "../platform/pac", package = "py32f071-pac" }
py32-hal = { path = "../platform/hal" }
bsp = { path = "../platform/bsp" }
drivers = { path = "../driver", default-features = false, features = ["display"] }
abi = { path = "../abi" }
kernel = { path = "../kernel", default-features = false }
gfx = { path = "../lib/gfx", default-features = false }
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
heapless = { workspace = true }
kernfs = { path = "../lib/kernfs" }
crypto = { path = "../lib/crypto" }
utils = { path = "../lib/utils" }
calib = { path = "../lib/calib" }

[features]
default = [
    "radio",
    "audio",
    "filesystem",
    "uart",
    "usb",
    "usb_cdc",
    "wire",
    "dma",
    "hw_crc",
    "rtc",
    "internal_flash",
    "krx_native",
    "krx_paged",
    "flashlight",
    "animations",
    "dynamic_spi",
    "overclock_72mhz",
    "text_input",
]

# 🔌 Bootloader DFU Raw Fallback (optional; primary UI/hooks offloaded to /apps/dfu.mod)
dfu = []

# 📦 Media & Asset Provisioning
provision_rogers = []
provision_apps = []
provision_bench = []

# ⚙️ Granular Settings & Diagnostics
settings_info = []
settings_calib = []
settings_debug = []
overclock_72mhz = []

# ⚙️ Execution Runtime Engines
krx_native = ["text_input", "filesystem"]
krx_paged = ["krx_native"]

# 📡 Hardware Peripheral & RF Subsystems
radio = ["drivers/radio"]
rf_fsk = []
fm_radio = ["drivers/fm_radio"]
audio = ["drivers/audio", "kernel/audio"]
uart = ["drivers/uart", "kernel/uart"]
usb = ["drivers/usb"]
usb_cdc = ["usb", "drivers/usb_cdc"]
wire = []
# USB MSC & Virtual FAT are preserved in framework for modularity but left disabled:
# Costs ~5KB Flash + 512B RAM buffers, risks host FAT cache desynchronization,
# and causes OS metadata pollution. Filesystem is accessed directly via CDC serial protocol instead.
usb_msc = ["usb", "drivers/usb_msc"]
usb_msc_fat = ["usb_msc", "drivers/usb_msc_fat"]
dma = []
hw_crc = []
rtc = []
internal_flash = []

# 💾 Storage & Cryptographic Security
filesystem = ["drivers/filesystem", "kernel/filesystem"]
secure_fs = ["drivers/secure_fs", "kernel/secure_fs"]
passcode = ["secure_fs", "text_input", "gfx/passcode"]
text_input = ["gfx/inverted_status"]
settings_edit = ["text_input"]
app_hibernation = ["filesystem"]

# 🎨 Display, Sound & Asset Bundles
boot_assets = []
boot_jingle = []
extra_rogers = []
flashlight = []
animations = []
grayscale = ["drivers/grayscale", "gfx/grayscale"]
dynamic_spi = []

# 📻 Hardware Target Board Profiles (base default supports UV-K1 and UV-K5v3 identically)
target_k10pro = [
    "bsp/target_k10pro",
    "drivers/target_k10pro",
    "py32-hal/target_k10pro",
    "gnss",
]
gnss = ["drivers/gnss"]
swd_debug = ["bsp/swd_debug", "drivers/swd_debug"]

# 📦 Feature Bundles & Group Configurations
full = ["default", "passcode"]
security = ["filesystem", "secure_fs", "passcode"]
lean = ["radio", "audio"]
