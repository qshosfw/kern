[package]
name = "drivers"
version = "0.1.0"
edition = "2024"

[dependencies]
abi = { path = "../abi" }
kern-platform-traits = { path = "../hal-traits" }
kernel = { path = "../kernel" }
utils = { path = "../util" }
crypto = { path = "../crypto" }
cortex-m = { workspace = true }
heapless = { workspace = true }
kernfs = { path = "../fs" }
calib = { path = "../calib" }
embedded-hal = { workspace = true }

[features]
default = ["radio", "filesystem", "uart", "display", "usb", "usb_cdc"]
target_k10pro = ["gnss", "rgb_backlight", "si4732", "fm_radio"]
si4732 = []
swd_debug = []
gnss = []
rgb_backlight = []
radio = ["kernel/radio"]
filesystem = []
uart = []
display = []
fm_radio = []
usb = []
usb_cdc = ["usb"]
usb_msc = ["usb"]
usb_msc_fat = ["usb_msc"]
grayscale = []

