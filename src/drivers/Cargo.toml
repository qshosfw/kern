[package]
name = "drivers"
version = "0.1.0"
edition = "2024"

[dependencies]
bsp = { path = "../board/uv-k1" }
py32-pac = { path = "../mcu/py32f071/pac", package = "py32f071-pac" }
kern-platform-traits = { path = "../hal-traits" }
kernel = { path = "../kernel" }
utils = { path = "../util" }
crypto = { path = "../crypto" }
cortex-m = { workspace = true }
heapless = { workspace = true }
kernfs = { path = "../fs" }
calib = { path = "../calib" }
embedded-hal = { workspace = true }
py32-hal = { path = "../mcu/py32f071/hal" }

[features]
default = ["radio", "filesystem", "uart", "display", "usb", "usb_cdc"]
target_k10pro = ["bsp/target_k10pro", "gnss", "rgb_backlight"]
swd_debug = ["bsp/swd_debug"]
gnss = []
rgb_backlight = []
radio = ["kernel/radio"]
filesystem = []
uart = []
display = []
secure_fs = ["kernel/secure_fs"]
fm_radio = []
usb = []
usb_cdc = ["usb"]
usb_msc = ["usb"]
usb_msc_fat = ["usb_msc"]
grayscale = []

