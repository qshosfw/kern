[package]
name = "py32f071-pac"
version = "0.1.0"
edition = "2024"
description = "Minimal hand-rolled PAC for PY32F071xB (ARM Cortex-M0+)"

[dependencies]
cortex-m = { workspace = true }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m-rt = { workspace = true, features = ["device"] }
