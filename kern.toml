#   kern microkernel configuration

[project]
name = "kern"
version = "0.1.0"
authors = ["kern-team"]
edition_string = "Kern OS"
chip = "PY32F071xB"
flash_budget = 120832   # 118 KB (safe margin below 128KB)
flash_ceiling = 114108  # Ratchet: release flash may only go down; lower after each saving
ram_budget = 16384      # 16 KB SRAM

[target]
device = "UV-K1"        # Options: "UV-K1", "UV-K5v3" (shared profile), "UV-K10Pro", "Custom"
cpu_clock = 48          # Options: 48, 72 (MHz)
nav_layout = "k1"       # Options: "k1", "k5"

# =============================================================================
# ⚙️  Granular Feature Gates (Core Framework Profile)
# =============================================================================
# Set any feature to false to completely eliminate its code and RAM footprint.

[features.hardware]
radio = true            # 📡 BK4819 RF transceiver driver and radio services
fm_radio = false        # 📻 BK1080 broadcast FM receiver (64-108 MHz)
uart = true             # 🔌 USART serial debug console and telemetry
usb = true              # 💻 Native USB 2.0 Full-Speed core controller
usb_cdc = true          # 🔌 USB CDC ACM Virtual COM Port (Serial console)
wire = true             # ⚡ RigWire binary serial protocol engine

# ── USB Mass Storage (MSC) & Virtual FAT: DISABLED BY DEFAULT ────────────────
usb_msc = false         # 💾 USB Mass Storage Class (Disabled - prefer CDC protocol)
usb_msc_fat = false     # 📁 Virtual FAT16 filesystem (Disabled - prefer CDC protocol)

[features.storage_security]
filesystem = true       # 📂 KernFS flash filesystem
secure_fs = false       # 🔒 Ascon-128 encrypted storage
passcode = false        # 🔑 Security enclave boot PIN lock & KDF stretching
app_hibernation = false # 📦 Two-tier KRX app hibernation (Tier-1 RAM RLE + Tier-2 KernFS /sys/swap/)

[features.runtime]
krx_native = true       # 🚀 Class N0/N1/P0 Thumb-1 Native & Structured-Leaf Execution
krx_paged = true        # 📄 Class P1 v2 Unlimited-Size Streamed Virtual Code Cache (up to 384 KiB)

[features.provisioning]
provision_apps = false        # 📱 Mode B: Embed & provision built-in KRX packages (delivered via RigWire / kern flash --assets)
provision_rogers = false     # 🎵 Embed & provision built-in roger beep tones to /user/rogers/
extra_rogers = false         # 📢 Mode B: Extended roger beep collection (Apollo 11, etc. loaded from flash)
boot_assets = false          # 🎨 Mode B: Embedded ROM splash screens (splash loaded from flash)
boot_jingle = false          # 🎵 Mode B: Polyphonic boot jingles & melody previews (loaded from flash)

[features.display]
animations = true       # ✨ Smooth kinetic scrolling, slide transitions & adaptive 60-90 Hz animation refresh
text_input = false      # ⌨️ Native OS multi-tap T9 TextInput modal (offloaded by default; enable for passcode/legacy)
i18n = false            # 🌐 Live external .lng/.fnt localization engine (enable for non-ASCII language packs)
grayscale = false       # 🌓 True 2-bit 4-level grayscale with 500 Hz temporal FRC (1-bit spatial dither when false)

[features.diagnostics]
overclock_72mhz = true     # ⚡ Dynamic 72 MHz CPU overclocking menu option
