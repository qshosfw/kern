cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
    "src/abi",
    "src/hal-traits",
    "src/kernel",
    "src/drivers",
    "src/fs",
    "src/gfx",
    "src/crypto",
    "src/calib",
    "src/util",
    "src/mcu/py32f071/pac",
    "src/mcu/py32f071/hal",
    "src/board/uv-k1",
    "src/firmware",
    "sdk/rust",
]
resolver = "2"

[workspace.dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
heapless = "0.8.0"
embedded-hal = "1.0.0"
portable-atomic = { version = "1.6.0", features = ["fallback"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
overflow-checks = false
debug = 0
strip = false
incremental = false

[profile.dev]
opt-level = 0
debug = 1
lto = "off"
codegen-units = 16
panic = "immediate-abort"

[profile.dev.package.crypto]
opt-level = 2

[profile.dev.package.kernfs]
opt-level = 2

[profile.test]
opt-level = 0
debug = 1
lto = "off"
codegen-units = 16

[profile.test.package.crypto]
opt-level = 2

[profile.test.package.kernfs]
opt-level = 2

# Host-side tools (`./kern abi`): prebuilt std, so the default panic strategy.
[profile.host]
inherits = "dev"
panic = "unwind"
