[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=--gc-sections",
  "-C", "link-arg=--icf=all",
  "-C", "target-cpu=cortex-m0plus",
  "-C", "no-vectorize-loops",
  "-C", "opt-level=z",
  "-Z", "mir-opt-level=1",
  "-Z", "location-detail=none",
  "-Z", "fmt-debug=none",
]

